# PEP 8 permite subir el límite de 79 a 99 columnas cuando el equipo lo prefiere, con la
# condición de seguir envolviendo comentarios y docstrings antes. Este proyecto usa 99:
# las fórmulas financieras y las consultas SQL quedan más legibles en una línea que
# partidas a la mitad. La regla se verifica en test_estilo.py, así que no depende de que
# alguien tenga un linter instalado.
[pycodestyle]
max-line-length = 99

[flake8]
max-line-length = 99
exclude = .git,__pycache__,static

[mypy]
python_version = 3.9
ignore_missing_imports = True
